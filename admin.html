<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Math Quest</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f9ff;color:#26344a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1150px;margin:auto;padding:25px 15px 50px}.card{background:#fff;border:1px solid #e5ebf3;border-radius:22px;padding:23px;box-shadow:0 12px 30px rgba(50,75,110,.09)}input,button{font:inherit;padding:11px 13px;border-radius:11px}input{border:1px solid #dce4ef}button{border:0;background:#5b8def;color:white;font-weight:800;cursor:pointer}.secondary{background:white;color:#26344a;border:1px solid #dce4ef}.hidden{display:none}.toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat{background:#f7f9fc;border-radius:14px;padding:14px}.stat b{display:block;font-size:26px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:780px}th,td{padding:10px;border-bottom:1px solid #e5ebf3;text-align:left;font-size:13px}th{background:#f7f9fc}.detail{margin-top:18px;padding:16px;background:#f8fafc;border-radius:16px}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.ans{padding:9px;border-radius:10px;background:#fff;border:1px solid #e5ebf3;font-size:13px}.good{background:#effaf4;border-color:#bce8d0}.bad{background:#fff1f2;border-color:#f2c4c8}@media(max-width:700px){.stats,.answers{grid-template-columns:1fr 1fr}}
</style></head><body><main class="wrap">
<div class="card" id="login"><h1>🔐 Admin Math Quest</h1><p>Masukkan PIN admin.</p><input id="pin" type="password" placeholder="PIN"><button onclick="login()">Masuk</button></div>
<div class="card hidden" id="panel"><div class="toolbar"><div><h1 style="margin:0">📋 Data Peserta</h1><span id="sub" style="color:#718097"></span></div><div><button class="secondary" onclick="exportCSV()">Export CSV</button> <button class="secondary" onclick="loadData()">Refresh</button> <button class="secondary" onclick="logout()">Keluar</button></div></div>
<div class="stats"><div class="stat"><b id="total">0</b>Peserta</div><div class="stat"><b id="avg">0</b>Rata-rata nilai</div><div class="stat"><b id="best">0</b>Nilai tertinggi</div></div>
<div class="tablewrap"><table><thead><tr><th>Waktu</th><th>Nama</th><th>Kelas</th><th>Benar</th><th>Salah</th><th>Nilai</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
<div id="detail"></div></div></main>
<script>
let records=[],pin="";
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function login(){pin=document.getElementById("pin").value;if(!pin)return alert("Masukkan PIN.");await loadData();if(records.length>=0){document.getElementById("login").classList.add("hidden");document.getElementById("panel").classList.remove("hidden");}}
async function loadData(){
 const r=await fetch("https://htvgfkohnozoyqidpabl.supabase.co/functions/v1/bright-function",{headers:{"x-admin-pin":pin}});
 if(!r.ok){if(r.status===401)alert("PIN admin salah.");else alert("Gagal mengambil data.");return;}
 records=await r.json();render();
}
function render(){
 document.getElementById("total").textContent=records.length;
 let avg=records.length?records.reduce((s,x)=>s+Number(x.score),0)/records.length:0;
 document.getElementById("avg").textContent=avg.toFixed(2);document.getElementById("best").textContent=records.length?Math.max(...records.map(x=>Number(x.score))).toFixed(2):"0";
 document.getElementById("sub").textContent=records.length+" peserta tersimpan";
 document.getElementById("rows").innerHTML=records.map((x,i)=>`<tr><td>${new Date(x.submitted_at).toLocaleString("id-ID")}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.class_name)}</td><td>${x.correct_count}</td><td>${x.wrong_count}</td><td><b>${x.score}</b></td><td><button onclick="detail(${i})">Lihat</button></td></tr>`).join("");
}
function detail(i){const x=records[i];document.getElementById("detail").innerHTML=`<div class="detail"><div class="toolbar"><h2>${esc(x.name)} · ${esc(x.class_name)}</h2><button class="secondary" onclick="document.getElementById('detail').innerHTML=''">Tutup</button></div><p>Nilai: <b>${x.score}</b> · Benar: ${x.correct_count} · Salah/kosong: ${x.wrong_count}</p><div class="answers">${x.answers.map(a=>`<div class="ans ${a.correct?'good':'bad'}"><b>No. ${a.no}</b> · ${a.correct?'✓ Benar':'✗ Salah/kosong'}<br>Jawaban: ${esc(a.answer||'—')}</div>`).join("")}</div></div>`}
function exportCSV(){if(!records.length)return;let rows=[["Waktu","Nama","Kelas","Benar","Salah","Nilai"]];records.forEach(x=>rows.push([new Date(x.submitted_at).toLocaleString("id-ID"),x.name,x.class_name,x.correct_count,x.wrong_count,x.score]));let csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv"}));a.download="math-quest-rekap.csv";a.click()}
function logout(){location.reload()}
</script></body></html>
